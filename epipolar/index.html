<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GUI, NumberController } from 'three/addons/libs/lil-gui.module.min.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';

const Cam = window.Cam, Epi = window.Epi;   // classic scripts, so the page also runs from file://

// lil-gui number controller whose slider track follows a non-linear mapping; the number field stays in real
// units. lil-gui maps the pointer to a linear value in [min, max] and passes it to _snapClampSetValue (after
// _setDraggingStyle(true)); that linear value is reinterpreted through { fromFrac(t, min, max), toFrac(v, min, max) }.
class MappedNumberController extends NumberController {

  _setDraggingStyle(active, type) {

  _snapClampSetValue(v) {
    if (this._sliderDrag && this._map) v = this._map.fromFrac((v - this._min) / (this._max - this._min), this._min, this._max);
    return super._snapClampSetValue(v);

    if (this._hasSlider && this._map)

    return this;

// logarithmic track: equal track lengths are equal ratios
const LOG_MAP = {
  fromFrac: (t, lo, hi) => Math.exp(Math.log(lo) + t * (Math.log(hi) - Math.log(lo))),
  toFrac: (v, lo, hi) => (Math.log(v) - Math.log(lo)) / (Math.log(hi) - Math.log(lo)),

// lil-gui moves a slider by one step per pixel of wheel delta, so a single wheel notch (~100 px) can throw it a
// hundred steps; instead a notch moves it a fixed share of the track (in the mapped track for mapped sliders). The
// track position is kept unrounded between events, so small trackpad deltas still add up past the step rounding.
const WHEEL_NOTCH = 0.02;

    if (!onSlider && !onInput) return;
    if (onSlider && Math.abs(e.deltaX) < Math.abs(e.deltaY) && c._hasScrollBar) return;   // let the panel scroll
    e.preventDefault(); e.stopPropagation();

    const px = (e.deltaX - e.deltaY) * (e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 400 : 1);
    frac = Math.max(0, Math.min(1, frac + px / 100 * WHEEL_NOTCH));

const addMapped = (folder, obj, prop, min, max, step, map) => new MappedNumberController(folder, obj, prop, min, max, step, map);

// ----------------------------------------------------------------------------
// Scene: objects in the world frame (Z up, metres) and their colours, shared by the 3D view and the pictures
// ----------------------------------------------------------------------------
const COL = {
  board: '#8c939d', boardLight: '#e9e9e9', boardDark: '#2b2d31',
  cube: '#4fa8ff', pyramid: '#f2d14b', cylinder: '#5fd38d',
  x: '#ff5c5c', y: '#5fd35f', z: '#5c8cff', grid: '#4a4f58',
  cams: ['#ff9f43', '#2ed3b7'],   // camera 1, camera 2
  epi: '#ff5cd1',                 // the epipolar plane and lines of the selection
  epipole: '#ffd84f', baseline: '#ffd84f', selected: '#ffffff', probe: '#ffb347', gap: '#ff5c5c',
};
const SHAPES = {
  board: { label: 'checkerboard', geom: Cam.checkerboard(7, 5, 0.25), color: COL.board },
  cube: { label: 'cube', geom: Cam.cube(1), color: COL.cube },
  pyramid: { label: 'pyramid', geom: Cam.pyramid(1.2, 1.5), color: COL.pyramid },
  cylinder: { label: 'cylinder', geom: Cam.cylinder(0.4, 1.6), color: COL.cylinder },
  axes: { label: 'world axes', geom: Cam.axes(1), color: null, edgeColors: [COL.x, COL.y, COL.z] },
  grid: { label: 'ground grid', geom: Cam.groundGrid(10, 1), color: COL.grid, noVertices: true },
};
const PLACES = {
  board: [-1.6, 0.6, 0, 20], cube: [2.4, 0.4, 0, 25], pyramid: [-0.3, 3.2, 0, 0], cylinder: [-2.9, 3.0, 0, 0],
};
const SCENE_CENTRE = [0, 1.8, 0.6];
const placed = key => Cam.placeVertices(SHAPES[key].geom.vertices, PLACES[key] ? PLACES[key].slice(0, 3) : [0, 0, 0], PLACES[key] ? PLACES[key][3] : 0);

// ----------------------------------------------------------------------------
// Parameters (saved in localStorage)
// ----------------------------------------------------------------------------
const round1 = x => Math.round(x * 10) / 10;
const aimed = (C, target = SCENE_CENTRE) => { const a = Cam.lookAt(C, target); return { x: C[0], y: C[1], z: C[2], yaw: round1(a.yaw), pitch: round1(a.pitch), roll: 0 }; };
// whole setups of the two cameras: the usual converging pair, a rectified stereo pair (same orientation, side by side:
// the epipolar lines come out horizontal and the epipoles at infinity), and a camera moving straight ahead (the
// epipole is then the focus of expansion, the lines radiate from it)
// Each sets both cameras: their poses (cams) and their intrinsics (intr, the same 24 mm, 1280 × 720 unless given).
const INTR = (focal = 24) => ({ focal, sensorW: 36, resolution: '1280×720', W: 1280, H: 720 });
const PRESETS = {
  // (camera 2 at the height that puts the cube's front top edge, as camera 1 sees it, in an epipolar plane: both its
  // corners lie on one epipolar line in each picture)
  'converging pair': { cams: [aimed([-2.2, -3.4, 1.6]), aimed([1.8, -3.9, 1.212])] },
  'rectified stereo': { cams: [{ x: -0.5, y: -4.5, z: 1.4, yaw: 0, pitch: -8, roll: 0 }, { x: 0.5, y: -4.5, z: 1.4, yaw: 0, pitch: -8, roll: 0 }] },
  'forward motion': { cams: [{ x: 0, y: -5.5, z: 1.1, yaw: 0, pitch: 0, roll: 0 }, { x: 0, y: -3.8, z: 1.1, yaw: 0, pitch: 0, roll: 0 }] },
  // a wide-angle camera close by and a long lens from afar (both see the whole scene): K₁ ≠ K₂, F = K₂⁻ᵀ E K₁⁻¹
  'wide + tele (24 / 70 mm)': { cams: [aimed([-2.2, -3.4, 1.6]), aimed([3, -11, 2.4])], intr: [INTR(24), INTR(70)] },
  // one centre, the camera only turned (towards the cube): no baseline, no epipolar geometry; every point of a ray
  // lands on one pixel of the other picture, x₂ = H x₁
  'pure rotation (no baseline)': { cams: [aimed([-1.2, -5.2, 1.6]), aimed([-1.2, -5.2, 1.6], [2.4, 0.4, 0.5])] },

const presetIntr = name => clone(PRESETS[name].intr || [INTR(), INTR()]);
const DEFAULTS = {
  preset: 'converging pair',
  // each camera's intrinsics and pose
  intr: [INTR(), INTR()],
  cams: PRESETS['converging pair'].cams,
  show: { board: true, cube: true, pyramid: true, cylinder: true, axes: true, grid: true },
  // the cube's front top-left corner as camera 1 sees it, picked in picture 1 (the front top edge lies in an epipolar
  // plane: see the presets); or { kind: 'pixel', cam, uv }
  selected: { kind: 'vertex', obj: 'cube', i: 7, cam: 0 },
  probe: null,   // metres along a picked pixel's ray: the point dragged along it (null: on the last but one marked)
  match: null,   // [u, v]: a candidate match of a picked pixel in the other picture, dragged there freely (null: none)
  planeScale: 25, showPlane: true, showPencil: false, showSamples: true,

const STORE = 'epipolar.state';
const clone = o => JSON.parse(JSON.stringify(o));
function loadState() {
  const P = clone(DEFAULTS);
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || '{}');
    for (const k of Object.keys(P)) if (k in saved) {
      if ((k === 'cams' || k === 'intr') && Array.isArray(saved[k]) && saved[k].length === 2) P[k] = saved[k].map((c, i) => ({ ...P[k][i], ...c }));
      else if (k === 'show') for (const j of Object.keys(P.show)) { if (saved.show && j in saved.show) P.show[j] = saved.show[j]; }
      else P[k] = saved[k];

const P = loadState();
const saveState = () => { try { localStorage.setItem(STORE, JSON.stringify(P)); } catch (e) { /* ignore */ } };

const RESOLUTIONS = { '640×480': [640, 480], '1280×720': [1280, 720], '1920×1080': [1920, 1080], '1600×1200': [1600, 1200] };
const SENSORS = { 'full frame (36 mm)': 36, 'APS-C (23.5 mm)': 23.5, '1″ (13.2 mm)': 13.2, 'phone 1/1.3″ (9.8 mm)': 9.8 };

// ----------------------------------------------------------------------------
// The two cameras, each with its own intrinsics (focal length, sensor, resolution: cams[k].W × H), and their
// epipolar geometry
// ----------------------------------------------------------------------------
let cams, geo;
function buildCameras() {

    const { focal, sensorW, W, H } = P.intr[k], fx = Cam.fxFromFocal(focal, sensorW, W);
    const K = Cam.intrinsics({ fx, fy: fx, cx: W / 2, cy: H / 2 });
    const R = Cam.rotationFromYawPitchRoll(c.yaw, c.pitch, c.roll), C = [c.x, c.y, c.z];
    return { ...Cam.makeCamera({ K, R, t: Cam.translationFromCentre(R, C) }), C, W, H, focal };

const noBaseline = () => geo.baseline < 1e-6;

const homography = () => Cam.mul(Cam.mul(cams[1].K, geo.R), Epi.invK(cams[0].K));

// for a pixel, points along its ray
// Points along a picked pixel's ray, spaced by the angle at the other camera's centre: its rays to them turn by equal
// steps across its view, from where the ray comes into its picture (the line enters it) to where it leaves (or a
// distance cap), so their images come out about evenly along its epipolar line and all show. They stay put; the
// probe, a further point dragged along the ray in the 3D view, starts on the last but one of them (P.probe null) and leaves
// that one's line behind when moved. In the epipolar plane, with b = C_k − C_o and the ray's direction r split into dx
// along b and dy across it, the point d along the ray is seen at φ(d) = atan2(d dy, |b| + d dx) from b; inverted,
// d = |b| sin φ / (dy cos φ − dx sin φ).
const SAMPLES = 6;

        .filter(a => a > 0 && a < phiCap).sort((a, c) => a - c);

  // is a true match: the foot's ray lies in the epipolar plane and meets the picked ray, at the probe. The match's own
  // ray tilts out of that plane: the wedge between the two rays, a sheet through the other centre, is seen from there
  // as the stub from the foot to the match. (The rays themselves pass each other, gap apart, where nearest.)

    // camera's rays to them, its line only in the other picture), except that the point nearest the vertex is the
    // vertex itself, the one of them that is really there
    if (s.cam !== undefined && ok[s.cam]) {

      sel.samples[near] = X;

      return { ...sel, probe, vertex: { X, q, ok, at: near, depth } };

  const c = Math.max(-1, Math.min(1, (R[0][0] + R[1][1] + R[2][2] - 1) / 2)), a = [R[2][1] - R[1][2], R[0][2] - R[2][0], R[1][0] - R[0][1]];
  let n = Math.hypot(...a), axis = a;
  if (n < 1e-6 && c < 0) {
    // a half turn: no skew part; the axis is any non-zero column of R + I
    const cols = [0, 1, 2].map(j => [0, 1, 2].map(i => R[i][j] + (i === j ? 1 : 0)));
    axis = cols.reduce((p, q) => Math.hypot(...q) > Math.hypot(...p) ? q : p); n = Math.hypot(...axis);
  }
  return `${fx1(Math.acos(c) * 180 / Math.PI, 1)}°` + (n > 1e-9 ? ` about ${vec(axis.map(x => x / n), 2)}` : '');
}
// E's structure: its singular values (|t|, |t|, 0), and the four poses it allows, told apart by a point that must lie
// in front of both cameras (the selection's, or the middle of the scene)
function essentialStructure(sel) {
  const { E, R, t, baseline } = geo, { S } = Epi.svd3(E);
  const X = !sel ? SCENE_CENTRE : sel.kind === 'vertex' ? sel.X : sel.probe.X;
  const xh = cams.map(c => { const Xc = Cam.add(Cam.mulv(c.R, X), c.t); return Xc[2] > 1e-9 ? [Xc[0] / Xc[2], Xc[1] / Xc[2]] : null; });
  const tu = t.map(x => x / baseline), close = (A, B) => Math.hypot(...A.flat().map((x, i) => x - B.flat()[i])) < 1e-6;
  const rows = Epi.decomposeEssential(E).map((c, i) => {
    const d = xh[0] && xh[1] && Epi.depthsOf(c.R, c.t, xh[0], xh[1]);
    const verdict = !d ? '—' : d.z1 > 0 && d.z2 > 0 ? 'in front of both ✓' : d.z1 > 0 ? 'behind camera 2' : d.z2 > 0 ? 'behind camera 1' : 'behind both';
    const truth = close(c.R, R) && close([c.t], [tu]);
    return `<tr class="${d && d.z1 > 0 && d.z2 > 0 ? 'ok' : ''}"><td>${i + 1}</td><td>${axisAngle(c.R)}</td><td>${vec(c.t, 2)}</td>
      <td>${d ? `${fmt(d.z1 * baseline, 3)}, ${fmt(d.z2 * baseline, 3)}` : '—'}</td><td>${verdict}${truth ? ' (the true pose)' : ''}</td></tr>`;
  });
  const what = !sel ? 'the middle of the scene' : sel.kind === 'vertex' || !sel.match && sel.vertex && P.probe == null ? 'the selected vertex' : 'the probe';
  return `<div class="note num">Singular values of E: ${vec(S.map(Math.abs), 3)}: two equal, to the baseline |t| = ${fmt(baseline, 3)} m,
      and one 0. Any 3 × 3 matrix like that is an essential matrix, and it gives the pose back, up to the scale of t:
      with E = U diag(σ, σ, 0) Vᵀ, R = U W Vᵀ or U Wᵀ Vᵀ (W a quarter turn about z) and t = ±u₃, the last column of U.
      Of the four, only one puts a scene point in front of both cameras; here tested with ${what}:</div>
    <table class="cands"><tr><th></th><th>R</th><th>t (unit)</th><th>Z₁, Z₂ (m)</th><th>the point</th></tr>${rows.join('')}</table>
    ${xh[0] && xh[1] ? '' : '<div class="note warn">The test point is behind a camera: none of the four can be told apart with it.</div>'}`;
}
function updateMath(sel) {
  const el = document.getElementById('math');
  el.querySelectorAll('details').forEach(d => { openState[d.dataset.id] = d.open; });
  let html = '';
  const { R, t, E, F, baseline } = geo;
  html += section('pose', 'Relative pose', `
    <div class="eq"><i class="v">X</i>₂ = <i class="v">R</i> <i class="v">X</i>₁ + <i class="v">t</i>, &nbsp;
      <i class="v">R</i> = <i class="v">R</i>₂<i class="v">R</i>₁ᵀ = ${matrix(R, x => fx1(x, 3))} &nbsp;
      <i class="v">t</i> = <i class="v">t</i>₂ − <i class="v">R t</i>₁ = ${matrix(t.map(x => [x]), x => fx1(x, 3))}</div>
    <div class="note num">Baseline |<i class="v">C</i>₂ − <i class="v">C</i>₁| = ${fmt(baseline, 3)} m.</div>
    <div class="eq"><i class="v">K</i>₁ = ${matrix(cams[0].K, x => fx1(x, 1))} &nbsp; <i class="v">K</i>₂ = ${matrix(cams[1].K, x => fx1(x, 1))}</div>
    <div class="note num">${cams.map((c, k) => `camera ${k + 1}: ${fmt(c.focal, 3)} mm on ${fmt(P.intr[k].sensorW, 3)} mm, ${c.W} × ${c.H} px`).join('; ')};
      each with its principal point at its picture's centre.</div>
    ${baseline < 1e-6 ? '<div class="note warn">The two centres coincide: with no baseline there is no epipolar geometry (E = 0); a pure rotation maps one picture onto the other point for point.</div>' : ''}`);
  html += section('E', 'Essential matrix E = [t]× R', `
    <div class="eq"><i class="v">E</i> = ${matrix(E, x => fmt(x, 3))}</div>
    <div class="note">x̂₂ᵀ <i class="v">E</i> x̂₁ = 0 for the normalised coordinates x̂ = <i class="v">K</i>⁻¹ x of any scene point's two
      images: the vectors from <i class="v">C</i>₁ and <i class="v">C</i>₂ to the point and the baseline <i class="v">t</i> lie in one plane, the epipolar plane.</div>
    ${baseline < 1e-6 ? '' : essentialStructure(sel)}`);
  html += section('F', 'Fundamental matrix F = K₂⁻ᵀ E K₁⁻¹', `
    <div class="eq"><i class="v">F</i> = ${matrix(baseline < 1e-6 ? F.map(r => r.map(() => 0)) : unitNorm(F), x => fmt(x, 3))}</div>
    <div class="note">(scaled to unit norm; F is only defined up to scale.) x₂ᵀ <i class="v">F</i> x₁ = 0 for pixels; the epipolar
      line of x₁ in picture 2 is l₂ = <i class="v">F</i> x₁, of x₂ in picture 1 l₁ = <i class="v">F</i>ᵀ x₂. F has rank 2: all
      epipolar lines of a picture pass through its epipole.${baseline < 1e-6 ? '' : ` Its singular values (at unit norm) (${Epi.svd3(unitNorm(F)).S.map(x => fmt(Math.abs(x) < 1e-9 ? 0 : Math.abs(x), 3)).join(', ')}): the last one 0, as for E (F = K₂⁻ᵀ E K₁⁻¹ keeps the rank, not the two equal values).`}</div>
    ${baseline < 1e-6 ? '<div class="note warn">With no baseline E and F are zero (to rounding): there are no epipoles and no epipolar lines.</div>' : `<table class="steps">
      <tr><td>epipole e₁ (the image of C₂ in camera 1; F e₁ = 0)</td><td>${epipoleTxt(0)}</td></tr>
      <tr><td>epipole e₂ (the image of C₁ in camera 2; Fᵀ e₂ = 0)</td><td>${epipoleTxt(1)}</td></tr>
    </table>`}`);
  if (baseline < 1e-6) {
    // a pure rotation: the homography, and where the selection goes
    const rows = [];
    if (sel && sel.kind === 'pixel') {
      const o = 1 - sel.k, q = project(sel.probe.X, o), xs = ['x₁', 'x₂'];
      rows.push([`${xs[sel.k]} (picked in picture ${sel.k + 1})`, vec(sel.uv, 1)]);
      if (inFront(q, o)) rows.push([`${xs[o]} = ${o ? 'H x₁' : 'H⁻¹ x₂'}: every point of its ray, at any depth`, vec(q.uv, 1)]);
    } else if (sel && sel.kind === 'vertex') {
      if (sel.ok[0]) rows.push(['x₁', vec(sel.q[0].uv, 1)]);
      if (sel.ok[1]) rows.push(['x₂ = H x₁', vec(sel.q[1].uv, 1)]);
    }
    html += section('H', 'Homography H = K₂ R K₁⁻¹ (pure rotation)', `
      <div class="eq"><i class="v">H</i> = ${matrix((H => H.map(r => r.map(x => x / H[2][2])))(homography()), x => fmt(x, 3))}</div>
      <div class="note">(scaled to H₃₃ = 1; like F, H is only defined up to scale.) Seen from one centre, a ray is a single point in both pictures: x₂ ~ <i class="v">H</i> x₁
        for every scene point, whatever its depth. The pictures map onto each other point for point, which is how a panorama
        is stitched, and nothing about depth can be learned: moving a camera's centre off the other's brings the epipolar
        geometry back.</div>
      ${rows.length ? `<table class="steps">${rows.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table>` : ''}`);
  }
  if (sel && baseline > 1e-6) {
    const rows = [];
    let title;
    if (sel.kind === 'vertex') {
      title = `Selected point: ${SHAPES[P.selected.obj].label}, vertex ${P.selected.i}`;
      rows.push(['scene point X', vec(sel.X, 3)]);
      if (sel.ok[0]) rows.push(['in picture 1: x₁', vec(sel.q[0].uv, 1)]);
      if (sel.ok[1]) rows.push(['in picture 2: x₂', vec(sel.q[1].uv, 1)]);
      if (sel.ok[0] && sel.ok[1]) {
        rows.push(['its epipolar line in picture 2: l₂ = F x₁', lineTxt(sel.lines[1])]);
        rows.push(['its epipolar line in picture 1: l₁ = Fᵀ x₂', lineTxt(sel.lines[0])]);
        rows.push(['x₂ from l₂', `${fmt(Epi.pointLineDistance(sel.lines[1], sel.q[1].uv), 2)} px`]);
        rows.push(['x₂ᵀ F x₁ (F at unit norm)', fmt(Epi.residual(unitNorm(F), sel.q[0].uv, sel.q[1].uv), 2)]);
      }
    } else {
      const o = 1 - sel.k, v = sel.vertex;
      title = v ? `Selected in picture ${sel.k + 1}: ${SHAPES[P.selected.obj].label}, vertex ${P.selected.i}` : `Selected pixel in picture ${sel.k + 1}`;
      rows.push([`x${sel.k ? '₂' : '₁'}`, vec(sel.uv, 1)]);
      rows.push([`its ray: C${sel.k ? '₂' : '₁'} + d · direction`, vec(sel.ray.dir, 3)]);
      rows.push([`its epipolar line in picture ${o + 1}: ${o ? 'l₂ = F x₁' : 'l₁ = Fᵀ x₂'}`, lineTxt(sel.lines[o])]);
      const pq = project(sel.probe.X, o), m = sel.match, xs = ['x₁', 'x₂'];
      if (m) {

        const [a, b] = sel.k ? [m.uv, sel.uv] : [sel.uv, m.uv];
        rows.push([`candidate match ${xs[o]}′ (the orange ring, dragged in picture ${o + 1})`, vec(m.uv, 1)]);
        rows.push([`its distance from ${o ? 'l₂' : 'l₁'}`, `${fmt(m.dist, 3)} px`]);
        rows.push([`${sel.k ? 'x₂ᵀ F x₁′' : 'x₂′ᵀ F x₁'} (F at unit norm)`, fmt(Epi.residual(unitNorm(F), a, b), 3)]);
        rows.push([`its ray: out of the epipolar plane by (the red wedge)`, `${fmt(m.angle, 3)}°`]);
        rows.push(['the two rays: the gap between them where nearest', m.gap < 5e-4 ? '0: they meet' : `${fmt(m.gap * 1000, 3)} mm`]);
        rows.push([`the probe: where the match moved onto the line triangulates, at d`, `${fmt(sel.probe.depth, 3)} m`]);
        if (!m.ahead) rows.push(['', '<span class="warn">moved onto the line, the match is seen behind a camera</span>']);
      } else {
        rows.push(['the probe (orange, drag it along the ray, or off the line in the other picture): at d', `${fmt(sel.probe.depth, 3)} m`]);
        if (inFront(pq, o)) rows.push([`its image in picture ${o + 1}, on the line`, vec(pq.uv, 1)]);
      }
      if (v) {
        rows.push(['the vertex: on the ray at d', `${fmt(v.depth, 3)} m`]);
        if (v.ok[o]) {
          rows.push([`its image in picture ${o + 1}`, vec(v.q[o].uv, 1)]);
          rows.push(['its distance from the line', `${fmt(Epi.pointLineDistance(sel.lines[o], v.q[o].uv), 2)} px`]);
        }
      }
    }
    html += section('sel', title, `<table class="steps">${rows.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table>
      <div class="note">${sel.kind === 'pixel'
        ? `Every scene point on this pixel's ray (the dots, ${sel.vertex ? 'the vertex among them' : 'spaced by equal angles as the other camera sees them'}) lands on the line in the other picture: from one picture alone the depth is unknown, and the search for the match is along that line.${sel.vertex ? ' The vertex is the one that is really there: its image is ringed on the line.' : ''}${sel.match
          ? ` A candidate match on the line (it snaps there) gives a ray that meets this one: the two triangulate a scene point. Off the line its ray tilts out of the epipolar plane (the red wedge, which the other camera sees edge on as the red stub), the rays pass each other, no scene point is seen at both pixels and x₂ᵀ F x₁ ≠ 0; its own epipolar line (dashed orange) misses ${sel.k ? 'x₂' : 'x₁'} too. Moved onto the line (the stub's foot), it triangulates the probe.` : ''}`
        : `The point, both centres and both images lie in the epipolar plane; the plane cuts each image plane in the epipolar line.`}</div>`);
  }
  el.innerHTML = html;
}
function updateCaption() {
  document.getElementById('caption').innerHTML = [
    `<span class="ln" style="border-color:${COL.epi}"></span>epipolar line of the selection`,
    `<span class="dot" style="background:${COL.epipole}"></span>epipole (the other camera's centre)`,
    P.showPencil ? 'colours: matching epipolar lines' : '',
  ].filter(Boolean).join(' · ');
}

// ----------------------------------------------------------------------------
// Controls
// ----------------------------------------------------------------------------
const gui = new GUI({ container: document.getElementById('gui'), title: 'Cameras' });
const refresh = () => gui.controllersRecursive().forEach(c => c.updateDisplay());
gui.add(P, 'preset', Object.keys(PRESETS)).name('preset').onChange(name => {
  P.cams = clone(PRESETS[name].cams); P.intr = presetIntr(name);
  P.probe = null; P.match = null;
  update();
});
const camFolders = [0, 1].map(k => {
  const f = gui.addFolder(`Camera ${k + 1}`), c = () => P.cams[k], intr = () => P.intr[k];
  // its intrinsics
  const ip = {};
  for (const key of ['focal', 'sensorW', 'resolution']) Object.defineProperty(ip, key, { get: () => intr()[key], set: v => { intr()[key] = v; } });
  addMapped(f, ip, 'focal', 8, 200, 0.1, LOG_MAP).name('focal length f (mm)').onChange(update);
  f.add(ip, 'sensorW', SENSORS).name('sensor').onChange(update);
  f.add(ip, 'resolution', Object.keys(RESOLUTIONS)).name('resolution').onChange(v => {
    // the same lens and sensor sampled more or less finely: a pixel picked in this picture keeps its place
    const [w, h] = RESOLUTIONS[v], i = intr();
    if (P.selected.kind === 'pixel' && P.selected.cam === k) P.selected.uv = [P.selected.uv[0] * w / i.W, P.selected.uv[1] * h / i.H];
    if (P.match && P.selected.cam !== k) P.match = [P.match[0] * w / i.W, P.match[1] * h / i.H];
    i.W = w; i.H = h; update();
  });
  // and its pose
  const proxy = {};
  for (const key of ['x', 'y', 'z', 'yaw', 'pitch', 'roll']) Object.defineProperty(proxy, key, { get: () => c()[key], set: v => { c()[key] = v; } });
  f.add(proxy, 'x', -10, 10, 0.05).name('X (m)').onChange(update);
  f.add(proxy, 'y', -12, 8, 0.05).name('Y (m)').onChange(update);
  f.add(proxy, 'z', -1, 8, 0.05).name('Z (m)').onChange(update);
  f.add(proxy, 'yaw', -180, 180, 0.5).name('yaw (°)').onChange(update);
  f.add(proxy, 'pitch', -89, 89, 0.5).name('pitch (°)').onChange(update);
  f.add(proxy, 'roll', -180, 180, 0.5).name('roll (°)').onChange(update);
  f.add({ aim: () => { Object.assign(c(), aimed([c().x, c().y, c().z])); update(); } }, 'aim').name('look at the objects');
  return f;
});
const fScene = gui.addFolder('Scene');
for (const key of Object.keys(SHAPES)) fScene.add(P.show, key).name(SHAPES[key].label).onChange(update);
const fView = gui.addFolder('View');
fView.add(P, 'showPlane').name('epipolar plane of the selection').onChange(update);
fView.add(P, 'showSamples').name('points along a picked pixel\'s ray').onChange(update);
fView.add(P, 'showPencil').name('epipolar lines through the epipoles').onChange(update);
addMapped(fView, P, 'planeScale', 1, 200, 1, LOG_MAP).name('camera enlarged ×').onChange(update);
gui.add({ reset: () => {
  const keep = clone(DEFAULTS);
  for (const k of Object.keys(keep)) if (k !== 'show') P[k] = keep[k];
  Object.assign(P.show, keep.show);
  update();
} }, 'reset').name('reset everything');
gui.controllersRecursive().filter(c => c._hasSlider).forEach(tameWheel);
camFolders.forEach(f => f.close()); fScene.close(); fView.close();
if (matchMedia('(max-width: 760px)').matches) gui.close();
document.getElementById('sw0').style.background = COL.cams[0];
document.getElementById('sw1').style.background = COL.cams[1];
// which pictures are folded away, remembered in this browser
[0, 1].forEach(k => {
  const box = document.getElementById('picBox' + k), KEY = 'epipolar.pic' + k;
  try { if (localStorage.getItem(KEY) === 'closed') box.open = false; } catch (e) { /* storage blocked */ }
  box.addEventListener('toggle', () => { try { localStorage.setItem(KEY, box.open ? 'open' : 'closed'); } catch (e) { /* ignore */ } });
});

// ----------------------------------------------------------------------------
function update() {
  buildCameras();
  const sel = selection();
  drawPicture(0, sel); drawPicture(1, sel);
  drawTexture(0, sel); drawTexture(1, sel);
  rebuild3D(sel);
  updateMath(sel);
  updateCaption();
  refresh();
  saveState();
  requestRender();
}
function layout() { resize3D(); const sel = selection(); drawPicture(0, sel); drawPicture(1, sel); }
new ResizeObserver(layout).observe(worldEl);
new ResizeObserver(() => { const sel = selection(); drawPicture(0, sel); drawPicture(1, sel); }).observe(document.getElementById('side'));
// the divider between the 3D view and the pictures: dragging it sets the pictures' share of the width, in per cent,
// remembered in this browser
{
  const app = document.getElementById('app'), bar = document.getElementById('splitter'), KEY = 'epipolar.split';
  const setSide = pc => app.style.setProperty('--side', Math.max(20, Math.min(75, pc)).toFixed(1) + '%');
  try { const pc = parseFloat(localStorage.getItem(KEY)); if (pc) setSide(pc); } catch (e) { /* storage blocked */ }
  let dragging = false;
  bar.addEventListener('pointerdown', e => { dragging = true; bar.setPointerCapture(e.pointerId); bar.classList.add('active'); e.preventDefault(); });
  bar.addEventListener('pointermove', e => {
    if (!dragging) return;
    const r = app.getBoundingClientRect();
    setSide((r.right - e.clientX) / r.width * 100);
  });
  const end = () => {
    if (!dragging) return;
    dragging = false; bar.classList.remove('active');
    try { localStorage.setItem(KEY, parseFloat(app.style.getPropertyValue('--side'))); } catch (e) { /* ignore */ }
  };
  bar.addEventListener('pointerup', end); bar.addEventListener('pointercancel', end);
  bar.addEventListener('dblclick', () => { app.style.removeProperty('--side'); try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ } });
}
update();
resize3D();
</script>
